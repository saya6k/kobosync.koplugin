name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          # PUC Lua 5.1, not LuaJIT: luarocks.org's manifest has grown past
          # LuaJIT's 65536-constants-per-function load limit, and the luajit
          # tarballs 404 from luajit.org anyway. The plugin targets Lua 5.1
          # either way.
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install tools
        run: |
          luarocks install luacheck
          luarocks install busted
          luarocks install dkjson
      - name: Lint
        run: luacheck .
      - name: Test
        run: busted spec/

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: ./scripts/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/kobosync.koplugin.zip
          generate_release_notes: true
