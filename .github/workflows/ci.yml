name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          # luajit-2.1 tarballs are no longer downloadable from luajit.org;
          # openresty's LuaJIT fork is fetched from git and stays available.
          luaVersion: "luajit-openresty"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install tools
        run: |
          luarocks install luacheck
          luarocks install busted
          luarocks install dkjson
      - name: Lint
        run: luacheck .
      - name: Test
        run: busted spec/

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: ./scripts/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/kobosync.koplugin.zip
          generate_release_notes: true
