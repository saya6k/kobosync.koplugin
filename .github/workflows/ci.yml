name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          # PUC Lua 5.1, not LuaJIT: luarocks.org's manifest has grown past
          # LuaJIT's 65536-constants-per-function load limit, and the luajit
          # tarballs 404 from luajit.org anyway. The plugin targets Lua 5.1
          # either way.
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install tools
        run: |
          luarocks install luacheck
          luarocks install busted
          luarocks install dkjson
      - name: Lint
        run: luacheck .
      - name: Test
        run: busted spec/

  release:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Build from the released tag, not from main: the two differ whenever a
      # release is cut from an older commit. fetch-depth 0 so the version-sync
      # step below can commit onto main from this same clone.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Stamp version from tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/^\( *version = \)\"[^\"]*\"/\1\"$VERSION\"/" _meta.lua
          grep -q "version = \"$VERSION\"" _meta.lua
      - name: Package
        run: ./scripts/package.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/kobosync.koplugin.zip
      # Keep the default branch in sync so the "Direct download from repo"
      # install path (branch zipball) reports the same version as the release.
      - name: Sync version to main
        run: |
          git checkout -- _meta.lua
          git switch -c version-sync origin/main
          sed -i "s/^\( *version = \)\"[^\"]*\"/\1\"$VERSION\"/" _meta.lua
          if git diff --quiet -- _meta.lua; then
            echo "main is already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: set version to $VERSION [skip ci]" -- _meta.lua
          git push origin HEAD:main
